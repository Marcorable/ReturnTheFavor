# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  auto_review:
    enabled: true
    base_branches:
      - develop
  path_instructions:
    - path: "**/*.swift"
      instructions: >-
        `.claude/rules/marcorable-swift/` 의 규칙을 기준으로 리뷰한다.
        새 화면은 Screen 패턴(`<Name>Screen` 의 Model·ViewModel·Context)을 따른다.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - ".claude/rules/**/*.md"
