# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  auto_review:
    enabled: true
    base_branches:
      - develop
  path_instructions:
    - path: "**/*.ts"
      instructions: >-
        `AGENTS.md`의 Project Boundaries와 Safety and Review를 기준으로 리뷰한다.
        데이터 유실, SQLite 일관성, 플랫폼별 권한·알림·날짜 차이를 우선 확인한다.
    - path: "**/*.tsx"
      instructions: >-
        `AGENTS.md`의 Project Boundaries와 Safety and Review를 기준으로 리뷰한다.
        데이터 유실, SQLite 일관성, 플랫폼별 권한·알림·날짜 차이를 우선 확인한다.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/adr/**/*.md"
